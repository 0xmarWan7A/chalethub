{% extends "base.html" %} {% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1>إدارة التصنيفات</h1>
  <a href="{{ url_for('admin_category_add') }}" class="btn btn-gold">
    <i class="bi bi-plus-circle"></i> إضافة تصنيف جديد
  </a>
</div>

<div class="card">
  <div class="card-body">
    <div class="table-responsive">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>#</th>
            <th>الصورة</th>
            <th>الاسم (عربي)</th>
            <th>الاسم (إنجليزي)</th>
            <th>الوصف</th>
            <th>الأيقونة</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody>
          {% for cat in categories %}
          <tr>
            <td>{{ cat.id }}</td>
            <td>
              <img
                src="{{ get_image_url_dynamic(cat.image) }}"
                style="
                  width: 60px;
                  height: 60px;
                  object-fit: cover;
                  border-radius: 10px;
                "
                onerror="this.src='{{ url_for('static', filename='img/default_category.jpg') }}'"
              />
            </td>
            <td>{{ cat.name_ar }}</td>
            <td>{{ cat.name_en }}</td>
            <td>{{ cat.description[:30] }}...</td>
            <td><i class="bi {{ cat.icon }}"></i></td>
            <td>
              <a
                href="{{ url_for('admin_category_edit', category_id=cat.id) }}"
                class="btn btn-sm btn-warning"
              >
                <i class="bi bi-pencil"></i>
              </a>
              <a
                href="{{ url_for('admin_category_delete', category_id=cat.id) }}"
                class="btn btn-sm btn-danger"
                onclick="return confirm('هل أنت متأكد من حذف هذا التصنيف؟');"
              >
                <i class="bi bi-trash"></i>
              </a>
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</div>
{% endblock %}
