{% extends "base.html" %} {% block content %}
<h1 class="section-title">شاليهات {{ category.name_ar }}</h1>
<p class="text-muted">{{ category.description }}</p>

<div class="row">
  {% for chalet in chalets %}
  <div class="col-md-4 mb-4">
    <div class="card chalet-card h-100">
      <img
        src="{{ get_image_url_dynamic(chalet.image) }}"
        class="card-img-top"
        alt="{{ chalet.name_ar }}"
        onerror="this.src='{{ url_for('static', filename='img/C1.jpg') }}'"
      />
      <div class="card-body">
        <h5 class="card-title">{{ chalet.name_ar }}</h5>
        <p class="card-text text-muted">
          <i class="bi bi-geo-alt"></i> {{ chalet.location }}
        </p>
        <p class="card-text">{{ chalet.description_ar[:100] }}...</p>
        <div class="d-flex justify-content-between align-items-center">
          <span class="h5 text-primary"
            >{{ chalet.price_per_night }}<small class="text-muted"
              >/ليلة</small
            ></span
          >
          <a
            href="{{ url_for('chalet_detail', chalet_id=chalet.id) }}"
            class="btn btn-gold"
            >عرض</a
          >
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
